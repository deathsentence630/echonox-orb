<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echonox — Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Echonox</h1>
      <nav>
        <button id="tab-chat" class="active">Chat</button>
        <button id="tab-settings">Paramètres</button>
        <button id="tab-debug">Debug</button>
      </nav>
    </header>
    <main>
      <div id="chat-panel" class="panel active">
        <!-- Contenu du chat -->
        <div id="chatOutput" class="chat-output"></div>
        <textarea id="chatInput" placeholder="Écrivez votre message..."></textarea>
        <button id="chatSend">Envoyer</button>
      </div>
      <div id="settings-panel" class="panel">
        <!-- Contenu des paramètres -->
      </div>
      <div id="debug-panel" class="panel">
        <!-- Contenu du debug -->
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
